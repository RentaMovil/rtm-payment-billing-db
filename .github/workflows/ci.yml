name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

# rtm-payment-billing-db's tables reference booking.reservation, so
# rtm-booking-db's base tables need to exist first. booking-db's own
# changelog can't run start to finish yet at this point (it has a pending
# FK back to payment.invoice/payment.payment, see that repo's workflow),
# so this just runs booking-db's first pass -- enough to create
# booking.reservation -- before applying this repo's own migrations.
jobs:
  validate-migrations:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@v4
        with:
          path: own

      - name: Check out rtm-iam-db (starts the shared SQL Server)
        uses: actions/checkout@v4
        with:
          repository: RentaMovil/rtm-iam-db
          path: rtm-iam-db

      - name: Check out rtm-booking-db (payment's tables reference booking.reservation)
        uses: actions/checkout@v4
        with:
          repository: RentaMovil/rtm-booking-db
          path: rtm-booking-db

      - name: Create the shared Docker network
        run: docker network create rentamovil

      - name: Start SQL Server and apply iam's migrations
        working-directory: rtm-iam-db
        env:
          MSSQL_SA_PASSWORD: "CiOnly_${{ github.run_id }}!"
          IAM_APP_PASSWORD: "CiOnly_App123!"
        run: docker compose up --build --abort-on-container-exit --exit-code-from migrations

      - name: "Apply booking-reservation's migrations (stops at its own payment FK, expected)"
        working-directory: rtm-booking-db
        continue-on-error: true
        env:
          MSSQL_SA_PASSWORD: "CiOnly_${{ github.run_id }}!"
          BOOKING_APP_PASSWORD: "CiOnly_App123!"
        run: docker compose up --build --abort-on-container-exit --exit-code-from migrations

      # If this fails, check that booking.reservation actually got created in the step above
      # before assuming the bug is in this repo's own changelog.
      - name: Apply this repo's Liquibase migrations
        working-directory: own
        env:
          MSSQL_SA_PASSWORD: "CiOnly_${{ github.run_id }}!"
          PAYMENT_APP_PASSWORD: "CiOnly_App123!"
        run: docker compose up --build --abort-on-container-exit --exit-code-from migrations
